<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 4 Assignment</title>
</head>

<body>

    <h1>Registration Form</h1>

    <!-- Task 4.1: Basic Form with Name, Email, Password & Labels -->
    <form action="#" method="POST">
        <div>
            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" name="fullName" required>
        </div>
        <br>
        <div>
            <label for="userEmail">Email Address:</label>
            <input type="email" id="userEmail" name="userEmail" required>
        </div>
        <br>
        <div>
            <label for="userPassword">Password:</label>
            <input type="password" id="userPassword" name="userPassword" required>
        </div>
        <br>
        <!-- Task 4.2: Date of Birth -->
        <div>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob">
        </div>
        <br>

        <!-- Task 4.2: Phone Number -->
        <div>
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone">
        </div>
        <br>

        <!-- Task 4.2: Radio Buttons (Gender) -->
        <div>
            <label>Gender:</label><br>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label>
        </div>
        <br>

        <!-- Task 4.2: Checkboxes (Hobbies) -->
        <div>
            <label>Hobbies:</label><br>
            <input type="checkbox" id="coding" name="hobbies" value="coding">
            <label for="coding">Coding</label>
            <input type="checkbox" id="reading" name="hobbies" value="reading">
            <label for="reading">Reading</label>
            <input type="checkbox" id="sports" name="hobbies" value="sports">
            <label for="sports">Sports</label>
        </div>
        <br>

        <!-- Task 4.2: Dropdown (Select Course) -->
        <div>
            <label for="course">Select Course:</label>
            <select id="course" name="course">
                <option value="cse">B.Tech CSE</option>
                <option value="ece">B.Tech ECE</option>
                <option value="me">B.Tech ME</option>
            </select>
        </div>
        <br>

        <!-- Task 4.2: Textarea (Message Box) -->
        <div>
            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="4" cols="40" placeholder="Type your message here..."></textarea>
        </div>
        <br>
        <br>
        <!-- Task 4.2: Date of Birth -->
        <div>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob">
        </div>
        <br>

        <!-- Task 4.2: Phone Number -->
        <div>
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone">
        </div>
        <br>

        <!-- Task 4.2: Radio Buttons (Gender) -->
        <div>
            <label>Gender:</label><br>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label>
        </div>
        <br>

        <!-- Task 4.2: Checkboxes (Hobbies) -->
        <div>
            <label>Hobbies:</label><br>
            <input type="checkbox" id="coding" name="hobbies" value="coding">
            <label for="coding">Coding</label>
            <input type="checkbox" id="reading" name="hobbies" value="reading">
            <label for="reading">Reading</label>
            <input type="checkbox" id="sports" name="hobbies" value="sports">
            <label for="sports">Sports</label>
        </div>
        <br>

        <!-- Task 4.2: Dropdown (Select Course) -->
        <div>
            <label for="course">Select Course:</label>
            <select id="course" name="course">
                <option value="cse">B.Tech CSE</option>
                <option value="ece">B.Tech ECE</option>
                <option value="me">B.Tech ME</option>
            </select>
        </div>
        <br>

        <!-- Task 4.2: Textarea (Message Box) -->
        <div>
            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="4" cols="40" placeholder="Type your message here..."></textarea>
        </div>
        <br>

        <!-- Task 4.2: Submit Button -->
        <div>
            <button type="submit">Submit Registration</button>
        </div>
    </form>

</body>
